services:
  - type: web
    name: consultoria-edtech
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/estado-servidor
    envVars:
      - key: DB_SERVER
        value: servidor-consultoria-diego.database.windows.net
      - key: DB_NAME
        value: ConsultoriaDB
      - key: DB_USER
        value: admin_diego
      - key: DB_PASSWORD
        sync: false
      - key: EMAIL_APP
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: MODO_ALTA_VELOCIDAD
        value: "false"
      - key: AZURE_REPLICA
        value: "true"
